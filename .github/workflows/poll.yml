# Every 5 minutes: start check.yml for each new branch head and v* tag in the
# guest repos, and for a default-branch head whose only change since the
# commit Andrew last approved is testers.txt (a testers request, nothing
# built; ci/poll.py), with two app tokens: one that can only list the guest
# repos, then one limited to exactly those repos.
#
# What starts it (audit 2026-09-19): GitHub ran this schedule twice in about
# nine hours ("The schedule event can be delayed during periods of high loads
# of GitHub Actions workflow runs ... some queued jobs may be dropped", GitHub
# docs, events that trigger workflows). So the 5-minute tick is a launchd
# agent on Andrew's Mini sending a workflow_dispatch (`gh workflow run
# poll.yml`), and a workflow_dispatch "always create[s] workflow runs" (same
# docs). The cron below is only a backup, off the top of the hour, where
# GitHub's load peaks; the `poll` concurrency group absorbs a duplicate.
#
# GitHub disables a public repo's scheduled workflows after 60 days with no
# repository activity; README.md says how that is kept from happening.
name: poll

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: list what would start, write nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Metadata read is needed as well: measured 2026-09-18, a token with only
      # organization custom properties is scoped to zero repos and lists only
      # the public pipeline repo's properties.
      - name: App token that can only read the org's custom properties and repo metadata
        id: list-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: willoughby-apps
          permission-organization-custom-properties: read
          permission-metadata: read

      - name: List the guest repos
        id: list
        env:
          APP_TOKEN: ${{ steps.list-token.outputs.token }}
        run: python3 ci/poll.py --list-repos

      - if: steps.list.outputs.repos != ''
        name: App token for exactly the guest repos (contents read, statuses write, issues write)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: willoughby-apps
          repositories: ${{ steps.list.outputs.repos }}
          permission-contents: read
          permission-statuses: write
          # Only to tell Andrew, with a needs-andrew issue, that a commit failed
          # on his side three times (ci/alert.py).
          permission-issues: write
          permission-organization-custom-properties: read

      # This job runs no guest code and installs nothing; it never hands a
      # pushed tester list to the Mini (only an approved commit's list applies).
      - name: Find new commits and start their checks (tester-only changes become testers requests)
        if: steps.list.outputs.repos != ''
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 ci/poll.py ${DRY_RUN:+--dry-run}
