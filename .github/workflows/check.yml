          IPA_SHA256: ${{ needs.build.outputs.ipa_sha256 }}
          SOURCE_SHA256: ${{ needs.fetch.outputs.source_sha256 }}
          PREVIEWS_COMMIT: ${{ needs.report.outputs.previews_commit }}
          PREVIEW_SCREENSHOT: ${{ needs.report.outputs.preview_screenshot }}
          PREVIEW_ICON: ${{ needs.report.outputs.preview_icon }}
          BASE_SHA: ${{ needs.fetch.outputs.base_sha }}
          BUNDLE_ID: ${{ needs.fetch.outputs.bundle_id }}
          CHANGES_JSON: ${{ runner.temp }}/reports/gate/changes.json
        run: python3 ci/request.py
