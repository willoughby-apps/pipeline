# By hand: run, on clean GitHub-hosted Mac and Windows machines, the
# non-interactive install commands the plugin's setup skill has a guest's
# Claude run (guest-apps/start/plugins/willoughby-apps/skills/setup/SKILL.md),
# then install the plugin from its marketplace without a prompt.
#
# What a runner cannot do is left out and named here: the Mac's
# `xcode-select --install` and the gh package's Installer window are clicks
# (a runner already has the command-line tools; the package is installed with
# `installer`, the same file the skill verifies), GitHub sign-in is a browser,
# and Claude sign-in needs a paid plan. Runner images already carry git and
# gh, so each step reports what it found and what the install left.
#
# No secret, no token (permissions: {}), no action: nothing here reads a
# guest repo.
name: setup-smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Install Claude Code (the documented one-line installer)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Claude Code version
        run: claude --version

      - name: git (Apple's command-line tools)
        run: |
          xcode-select -p
          git --version

      - name: gh from GitHub's own package, checksum verified (setup step 2)
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          curl -fsSL https://api.github.com/repos/cli/cli/releases/latest -o "$work/release.json"
          pkg_url=$(python3 -c 'import json,sys; a=json.load(open(sys.argv[1]))["assets"]; print(next(x["browser_download_url"] for x in a if x["name"].endswith("_macOS_universal.pkg")))' "$work/release.json")
          sums_url=$(python3 -c 'import json,sys; a=json.load(open(sys.argv[1]))["assets"]; print(next(x["browser_download_url"] for x in a if x["name"].endswith("_checksums.txt")))' "$work/release.json")
          pkg="$work/$(basename "$pkg_url")"
          curl -fsSL -o "$pkg" "$pkg_url"
          curl -fsSL -o "$work/checksums.txt" "$sums_url"
          want=$(grep " $(basename "$pkg")\$" "$work/checksums.txt" | cut -d' ' -f1)
          got=$(shasum -a 256 "$pkg" | cut -d' ' -f1)
          test -n "$want" && test "$want" = "$got"
          echo "checksum ok: $got"
          sudo installer -pkg "$pkg" -target /
          /usr/local/bin/gh --version

      - name: Plugin from the marketplace, no prompt
        run: |
          claude plugin marketplace add willoughby-apps/start
          claude plugin install willoughby-apps@willoughby-apps
          claude plugin list

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions: {}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Install Claude Code (the documented one-line installer)
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Claude Code version
        run: claude --version

      - name: winget (setup step 1, registering App Installer if missing)
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Add-AppxPackage -RegisterByFamilyName -MainPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe
          }
          winget --version

      - name: git with winget (setup step 1)
        run: |
          winget install --id Git.Git -e --source winget --accept-package-agreements --accept-source-agreements
          "winget exit code: $LASTEXITCODE"
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          git --version

      - name: gh with winget (setup step 2)
        run: |
          winget install --id GitHub.cli -e --source winget --accept-package-agreements --accept-source-agreements
          "winget exit code: $LASTEXITCODE"
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          gh --version

      - name: Plugin from the marketplace, no prompt
        run: |
          claude plugin marketplace add willoughby-apps/start
          claude plugin install willoughby-apps@willoughby-apps
          claude plugin list
