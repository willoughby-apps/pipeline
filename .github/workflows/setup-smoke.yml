# By hand: run, on clean GitHub-hosted Mac and Windows machines, the
# non-interactive install commands the plugin's setup skill has a guest's
# Claude run (guest-apps/start/plugins/willoughby-apps/skills/setup/SKILL.md),
# then install the plugin from its marketplace without a prompt.
#
# What a runner cannot do is left out and named here: the Mac's
# `xcode-select --install` and the gh package's Installer window are clicks
# (a runner already has the command-line tools; the package is installed with
# `installer`, the same file the skill verifies), GitHub sign-in is a browser,
# and Claude sign-in needs a paid plan. Runner images already carry git and
# gh, so each step reports what it found and what the install left.
#
# Since 2026-09-19 it also checks the one-paste setup (setup.md is where the
# paste reads it) and the icon skill's no-install tools: the Mac `sips` and
# `qlmanage` steps, and on Windows the plugin's icon.ps1 (System.Drawing) and
# Edge drawing an SVG.
#
# No secret, no token (permissions: {}), no action: nothing here reads a
# guest repo.
name: setup-smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Install Claude Code (the documented one-line installer)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Claude Code version
        run: claude --version

      - name: git (Apple's command-line tools)
        run: |
          xcode-select -p
          git --version

      - name: gh from GitHub's own package, checksum verified (setup step 2)
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          # Not api.github.com: unauthenticated, a shared runner IP gets 403
          # (measured 2026-09-19, twice); the release page's redirect names the tag.
          latest=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/cli/cli/releases/latest)
          version=${latest##*/v}
          echo "latest gh: $version"
          pkg_url="https://github.com/cli/cli/releases/download/v$version/gh_${version}_macOS_universal.pkg"
          sums_url="https://github.com/cli/cli/releases/download/v$version/gh_${version}_checksums.txt"
          pkg="$work/$(basename "$pkg_url")"
          curl -fsSL -o "$pkg" "$pkg_url"
          curl -fsSL -o "$work/checksums.txt" "$sums_url"
          want=$(grep " $(basename "$pkg")\$" "$work/checksums.txt" | cut -d' ' -f1)
          got=$(shasum -a 256 "$pkg" | cut -d' ' -f1)
          test -n "$want" && test "$want" = "$got"
          echo "checksum ok: $got"
          sudo installer -pkg "$pkg" -target /
          /usr/local/bin/gh --version

      - name: Plugin from the marketplace, no prompt
        run: |
          claude plugin marketplace add willoughby-apps/start
          claude plugin install willoughby-apps@willoughby-apps
          claude plugin list

      - name: setup.md where the one paste reads it
        run: |
          set -euo pipefail
          guide="$HOME/.claude/plugins/marketplaces/willoughby-apps/setup.md"
          test -f "$guide"
          head -5 "$guide"

      - name: Icon from sips (the icon skill's Mac steps, an RGBA picture that is not square)
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          python3 - "$work/wide.png" <<'PY'
          import struct, sys, zlib
          w, h = 600, 300
          rows = b"".join(b"\x00" + b"".join(bytes([x % 256, y % 256, 90, 120]) for x in range(w)) for y in range(h))
          def chunk(k, d): return struct.pack(">I", len(d)) + k + d + struct.pack(">I", zlib.crc32(k + d))
          open(sys.argv[1], "wb").write(b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0))
                                        + chunk(b"IDAT", zlib.compress(rows)) + chunk(b"IEND", b""))
          PY
          sips -p 600 600 --padColor 2A6F97 "$work/wide.png" --out "$work/square.png"
          sips -z 1024 1024 "$work/square.png" --out "$work/sized.png"
          sips -s format jpeg -s formatOptions best "$work/sized.png" --out "$work/flat.jpg"
          sips -m "/System/Library/ColorSync/Profiles/sRGB Profile.icc" "$work/flat.jpg" --out "$work/srgb.jpg"
          sips -s format png "$work/srgb.jpg" --out "$work/AppIcon.png"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$work/AppIcon.png"
          python3 - "$work/AppIcon.png" <<'PY'
          import struct, sys
          d = open(sys.argv[1], "rb").read()
          w, h, depth, ctype = struct.unpack(">IIBB", d[16:26])
          print("png", d[:8] == b"\x89PNG\r\n\x1a\n", w, h, depth, ctype)
          assert d[:8] == b"\x89PNG\r\n\x1a\n" and (w, h, ctype) == (1024, 1024, 2) and b"tRNS" not in d[:d.index(b"IDAT")]
          PY

      # The command is read from the installed icon skill, so the smoke runs
      # what the skill gives, not a copy of it.
      - name: A described icon, drawn as SVG and rendered with qlmanage (the skill's own command)
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          skill="$HOME/.claude/plugins/marketplaces/willoughby-apps/plugins/willoughby-apps/skills/icon/SKILL.md"
          # shellcheck disable=SC2016  # the backticks are the Markdown around the command
          cmd=$(grep -o '`qlmanage -t [^`]*`' "$skill" | head -1 | tr -d '`')
          test -n "$cmd"
          cmd=${cmd//TMPDIR/$work}
          echo "running: $cmd"
          printf '%s' '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><rect width="1024" height="1024" fill="#2a6f97"/><circle cx="512" cy="512" r="300" fill="#fff"/></svg>' > "$work/icon.svg"
          eval "$cmd"
          sips -g pixelWidth -g pixelHeight "$work/icon.svg.png"
          python3 - "$work/icon.svg.png" <<'PY'
          import struct, sys
          d = open(sys.argv[1], "rb").read()
          w, h = struct.unpack(">II", d[16:24])
          print("png", d[:8] == b"\x89PNG\r\n\x1a\n", w, h)
          assert d[:8] == b"\x89PNG\r\n\x1a\n" and (w, h) == (1024, 1024), (w, h)
          PY

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions: {}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Install Claude Code (the documented one-line installer)
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Claude Code version
        run: claude --version

      - name: winget (setup step 1, registering App Installer if missing)
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Add-AppxPackage -RegisterByFamilyName -MainPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe
          }
          winget --version

      - name: git with winget (setup step 1)
        run: |
          winget install --id Git.Git -e --source winget --accept-package-agreements --accept-source-agreements
          "winget exit code: $LASTEXITCODE"
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          git --version

      - name: gh with winget (setup step 2)
        run: |
          winget install --id GitHub.cli -e --source winget --accept-package-agreements --accept-source-agreements
          "winget exit code: $LASTEXITCODE"
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          gh --version

      - name: Plugin from the marketplace, no prompt
        run: |
          claude plugin marketplace add willoughby-apps/start
          claude plugin install willoughby-apps@willoughby-apps
          claude plugin list

      - name: setup.md where the one paste reads it
        run: |
          $guide = "$env:USERPROFILE\.claude\plugins\marketplaces\willoughby-apps\setup.md"
          if (-not (Test-Path -LiteralPath $guide)) { throw "no setup.md at $guide" }
          Get-Content -LiteralPath $guide -TotalCount 5

      - name: Icon from the plugin's icon.ps1 (Windows PowerShell 5.1, an ARGB picture that is not square)
        run: |
          $work = Join-Path $env:RUNNER_TEMP icon
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Add-Type -AssemblyName System.Drawing
          $src = New-Object System.Drawing.Bitmap 600, 300, ([System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
          $g = [System.Drawing.Graphics]::FromImage($src)
          $g.Clear([System.Drawing.Color]::FromArgb(120, 200, 40, 90))
          $g.Dispose()
          $src.Save("$work\wide.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $src.Dispose()
          $script = "$env:USERPROFILE\.claude\plugins\marketplaces\willoughby-apps\plugins\willoughby-apps\scripts\icon.ps1"
          powershell -NoProfile -ExecutionPolicy Bypass -File $script -In "$work\wide.png" -Out "$work\AppIcon.png" -Fit pad -Background 2A6F97
          if ($LASTEXITCODE -ne 0) { throw "icon.ps1 exited $LASTEXITCODE" }
          python -c "import struct,sys; d=open(sys.argv[1],'rb').read(); w,h,depth,ct=struct.unpack('>IIBB',d[16:26]); print('png',w,h,depth,ct); assert d[1:4]==b'PNG' and (w,h,ct)==(1024,1024,2) and b'tRNS' not in d[:d.index(b'IDAT')]" "$work\AppIcon.png"
          if ($LASTEXITCODE -ne 0) { throw "the icon is not a 1024x1024 RGB PNG" }

      # The icon skill's own command, read from the installed skill and run
      # in Windows PowerShell 5.1 (what a guest's Claude has) from a folder
      # with a space in its name. PowerShell does not wait for a GUI program
      # started with `&`; the skill's `Start-Process -Wait` must leave the
      # picture there before the next line runs.
      - name: A described icon, drawn as SVG and rendered with Edge (the icon skill's own command)
        shell: powershell
        timeout-minutes: 5
        run: |
          $skill = "$env:USERPROFILE\.claude\plugins\marketplaces\willoughby-apps\plugins\willoughby-apps\skills\icon\SKILL.md"
          $m = Select-String -LiteralPath $skill -Pattern '`(Start-Process -Wait -FilePath [^`]*msedge\.exe[^`]*)`'
          if (-not $m) { throw "no Edge command in the icon skill" }
          $line = $m[0].Matches[0].Groups[1].Value
          $work = Join-Path $env:RUNNER_TEMP 'svg dir'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Set-Content -LiteralPath "$work\icon.svg" -Encoding ascii -Value '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><rect width="1024" height="1024" fill="#2a6f97"/><circle cx="512" cy="512" r="300" fill="#fff"/></svg>'
          $url = ($work -replace '\\', '/') -replace ' ', '%20'
          $cmd = $line.Replace('TMPURL', $url).Replace('TMPDIR', $work)
          "running: $cmd"
          Invoke-Expression $cmd
          if (-not (Test-Path -LiteralPath "$work\icon-svg.png")) { throw "Edge wrote no screenshot by the time the skill's command returned" }
          python -c "import struct,sys; d=open(sys.argv[1],'rb').read(); w,h=struct.unpack('>II',d[16:24]); print('png',w,h); assert d[1:4]==b'PNG' and (w,h)==(1024,1024)" "$work\icon-svg.png"
          if ($LASTEXITCODE -ne 0) { throw "Edge's picture is not 1024x1024" }
          $script = "$env:USERPROFILE\.claude\plugins\marketplaces\willoughby-apps\plugins\willoughby-apps\scripts\icon.ps1"
          powershell -NoProfile -ExecutionPolicy Bypass -File $script -In "$work\icon-svg.png" -Out "$work\AppIcon.png"
          if ($LASTEXITCODE -ne 0) { throw "icon.ps1 exited $LASTEXITCODE" }
